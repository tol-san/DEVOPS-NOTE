apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
spec:
  selector:
    replicas: 1
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
      - name: mongodb
        image: <Image>
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - containerPort: <Port>
